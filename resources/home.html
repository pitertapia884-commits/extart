<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXTART</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .logo {
            font-size: 72px;
        }

        .title {
            font-size: 28px;
            letter-spacing: 8px;
            color: #8b0000;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 3px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="logo">🍞</div>
    <div class="title">EXTART</div>
    <div class="subtitle">simple. fast. yours.</div>
</body>
</html>
